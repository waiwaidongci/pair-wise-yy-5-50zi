<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工织锦纹样授权交付台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #f3efe7; color: #282018; }
    header { padding: 18px 24px; background: #fffaf2; border-bottom: 1px solid #d9cdbc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 17px; margin: 16px 0 8px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #8d3e37; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #71675c; }
    input, select { width: 100%; border: 1px solid #d9cdbc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    label { display: block; margin: 9px 0 5px; color: #76695e; font-size: 13px; }
    .app { display: grid; grid-template-columns: 280px 1fr 320px; gap: 16px; padding: 16px; }
    .panel { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 8px; padding: 14px; }
    .grid { display: grid; gap: 2px; margin: 0 auto; width: min(100%, 720px); border: 6px solid #72533c; background: #72533c; }
    .cell { aspect-ratio: 1; background: #f8ead2; cursor: pointer; border-radius: 2px; }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .swatch { aspect-ratio: 1; border-radius: 8px; border: 3px solid transparent; cursor: pointer; }
    .swatch.active { border-color: #1f1b16; }
    .blocks { display: grid; gap: 8px; }
    .stats { display: grid; gap: 8px; }
    .stat { display: flex; justify-content: space-between; border-bottom: 1px solid #e1d5c5; padding: 6px 0; }
    .preview { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; border: 1px solid #d9cdbc; padding: 6px; margin-top: 8px; }
    .mini { aspect-ratio: 1; border-radius: 2px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .warning { color: #a03a2e; font-weight: 800; }
    .muted { color: #8a7d6c; font-size: 12px; }
    .hint { font-size: 12px; color: #8a7d6c; line-height: 1.6; }

    /* 授权交付台 */
    .delivery { margin: 0 16px 16px; }
    .delivery-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .filters { display: flex; gap: 8px; }
    .filters select { width: auto; min-width: 150px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; margin-top: 12px; }
    .card { border: 1px solid #e1d5c5; border-radius: 8px; padding: 12px; background: #fff; }
    .card.is-dead { background: #f4eee3; }
    .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .badge { font-size: 12px; padding: 2px 10px; border-radius: 999px; color: #fff; white-space: nowrap; }
    .badge.pending { background: #b07d2b; }
    .badge.delivered { background: #1f5f78; }
    .badge.active { background: #355b38; }
    .badge.expired { background: #a03a2e; }
    .badge.rejected { background: #71675c; }
    .badge.invalid { background: #8a7f6d; }
    .kv { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px dashed #e6dccb; font-size: 13px; }
    .kv > span { color: #8a7d6c; white-space: nowrap; }
    .kv > b { text-align: right; font-weight: 600; }
    .scope { display: inline-block; background: #efe5d4; border: 1px solid #d9cdbc; border-radius: 999px; padding: 1px 9px; font-size: 12px; margin: 2px 4px 2px 0; }
    .card-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
    .card-actions button { padding: 7px 12px; font-size: 13px; }
    .snapwrap { display: flex; gap: 12px; align-items: center; margin: 8px 0; }
    .snapgrid { display: grid; gap: 1px; border: 4px solid #72533c; background: #72533c; padding: 3px; border-radius: 4px; }
    .snapgrid i { display: block; width: var(--cs, 8px); aspect-ratio: 1; border-radius: 1px; }
    .snapgrid.small { max-width: 120px; border-width: 3px; }

    /* 弹窗 */
    .modal-mask { position: fixed; inset: 0; background: rgba(31,27,22,.45); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
    .modal-mask[hidden] { display: none; }
    .modal { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 10px; padding: 18px 20px; width: min(660px, 94vw); max-height: 88vh; overflow: auto; }
    .modal h3 { margin: 0 0 10px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
    .scope-pick { display: flex; flex-wrap: wrap; gap: 8px; }
    .scope-pick label { display: flex; align-items: center; gap: 5px; margin: 0; border: 1px solid #d9cdbc; border-radius: 999px; padding: 5px 12px; background: #fff; color: #282018; cursor: pointer; }
    .scope-pick input { width: auto; }
    .daterow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .timeline { list-style: none; margin: 8px 0; padding: 0; border-left: 2px solid #d9cdbc; }
    .timeline li { padding: 3px 0 3px 14px; font-size: 13px; position: relative; }
    .timeline li::before { content: ""; position: absolute; left: -6px; top: 9px; width: 8px; height: 8px; border-radius: 50%; background: #8d3e37; }
    .usage-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 3px 0; }
    .usage-row i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); }
    #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: #2f261d; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; z-index: 30; max-width: 90vw; }
    #toast[hidden] { display: none; }
    @media (max-width: 1000px) { header { display: block; } .app { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>手工织锦纹样授权交付台</h1><div>绘制经纬网格纹样，冻结快照送审，签发授权期限与适用范围交付单。</div></div>
    <div class="toolbar"><button id="saveBtn">保存方案</button><button id="exportBtn" class="secondary">导出JSON</button></div>
  </header>
  <main>
    <div class="app">
      <aside class="panel">
        <h2>方案与送审</h2>
        <label>项目编号</label><input id="projectNo" placeholder="如 JN-2026-018">
        <label>版本号</label><input id="versionNo" placeholder="如 V1.0">
        <label>客户</label><input id="customer" list="customerList" placeholder="客户名称">
        <datalist id="customerList"></datalist>
        <label>制版人</label><input id="maker" placeholder="制版人姓名">
        <p class="hint">同一项目编号 + 版本号只能有一个在途方案。送审即冻结当时的网格与色线快照；客户确认前再改动画布或色线，旧交付单自动失效并留存历史。</p>
        <button id="submitBtn" style="width:100%">冻结快照并送审</button>
        <h2>画布</h2>
        <label>经向列数</label><input id="cols" type="number" value="18" min="6" max="36">
        <label>纬向行数</label><input id="rows" type="number" value="14" min="6" max="32">
        <button id="newBtn" style="width:100%">新建网格</button>
        <h2>色线库</h2>
        <div class="palette" id="palette"></div>
        <h2>基础纹样块</h2>
        <div class="blocks">
          <button data-block="dot" class="secondary">单点</button>
          <button data-block="cross" class="secondary">十字</button>
          <button data-block="diamond" class="secondary">小菱形</button>
        </div>
      </aside>
      <section class="panel"><div class="grid" id="grid"></div></section>
      <aside class="panel">
        <h2>操作</h2>
        <div class="toolbar"><button id="undoBtn" class="secondary">撤销</button><button id="redoBtn" class="secondary">重做</button></div>
        <p>点击填色，按住拖动可连续填色。</p>
        <h2>用色统计</h2>
        <div class="stats" id="stats"></div>
        <h2>重复单元预览</h2>
        <div class="preview" id="preview"></div>
        <h2>断线风险</h2>
        <div id="risk"></div>
      </aside>
    </div>
    <section class="panel delivery">
      <div class="delivery-head">
        <h2 style="margin:0">授权交付单</h2>
        <div class="filters">
          <select id="filterCustomer"><option value="">全部客户</option></select>
          <select id="filterStatus">
            <option value="">全部状态</option>
            <option value="pending">待审核</option>
            <option value="delivered">待客户确认</option>
            <option value="active">授权生效中</option>
            <option value="expired">已到期</option>
            <option value="rejected">已驳回</option>
            <option value="invalid">已失效（历史）</option>
          </select>
        </div>
      </div>
      <div class="cards" id="deliveryList"></div>
    </section>
  </main>

  <div class="modal-mask" id="modalMask" hidden><div class="modal" id="modalBox"></div></div>
  <div id="toast" hidden></div>

  <script src="snapshot.js"></script>
  <script src="authorization.js"></script>
  <script src="app.js"></script>
</body>
</html>
