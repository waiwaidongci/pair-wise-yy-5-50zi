<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工织锦纹样授权交付台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #f3efe7; color: #282018; }
    header { padding: 18px 24px; background: #fffaf2; border-bottom: 1px solid #d9cdbc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 24px; }
    h2 { font-size: 16px; margin: 16px 0 8px; }
    h3 { font-size: 14px; margin: 12px 0 6px; color: #76695e; }
    button { border: 0; border-radius: 8px; padding: 9px 12px; background: #8d3e37; color: #fff; font-weight: 800; cursor: pointer; font-size: 13px; }
    button:hover { filter: brightness(1.08); }
    button:disabled { background: #b9ac9c; cursor: not-allowed; filter: none; }
    button.secondary { background: #71675c; }
    button.tiny { padding: 5px 9px; font-size: 12px; border-radius: 6px; }
    input, select { width: 100%; border: 1px solid #d9cdbc; border-radius: 6px; padding: 8px; font: inherit; background: #fff; }
    input:read-only, input[readonly] { background: #f1ebe0; color: #76695e; }
    label { display: block; margin: 9px 0 5px; color: #76695e; font-size: 13px; }
    .app { display: grid; grid-template-columns: 270px 1fr 330px; gap: 14px; padding: 14px; align-items: start; }
    .panel { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 8px; padding: 14px; }
    .grid { display: grid; gap: 2px; margin: 0 auto; width: min(100%, 640px); border: 6px solid #72533c; background: #72533c; }
    .cell { aspect-ratio: 1; background: #f8ead2; cursor: pointer; border-radius: 2px; }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .swatch { aspect-ratio: 1; border-radius: 8px; border: 3px solid transparent; cursor: pointer; position: relative; padding: 0; }
    .swatch.active { border-color: #1f1b16; }
    .swatch .tag { position: absolute; right: 1px; bottom: 1px; font-size: 9px; background: rgba(255,255,255,.75); color: #282018; border-radius: 3px; padding: 0 2px; font-weight: 700; }
    .blocks { display: grid; gap: 8px; }
    .stats { display: grid; gap: 4px; }
    .stat { display: flex; justify-content: space-between; border-bottom: 1px solid #e1d5c5; padding: 4px 0; font-size: 13px; }
    .preview { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; border: 1px solid #d9cdbc; padding: 6px; margin-top: 8px; }
    .mini { aspect-ratio: 1; border-radius: 2px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .warning { color: #a03a2e; font-weight: 800; }
    .muted { color: #91836f; font-size: 12px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 800; color: #fff; white-space: nowrap; }
    .badge.unsent { background: #91836f; }
    .badge.in_review { background: #b07d2b; }
    .badge.rejected { background: #a03a2e; }
    .badge.approved { background: #2f6b4f; }
    .badge.expired { background: #6e6258; }
    .badge.confirmed { background: #355b38; }
    .badge.invalidated { background: #8a6f62; text-decoration: line-through; }
    .card { border: 1px solid #e1d5c5; border-radius: 8px; padding: 10px 12px; margin: 8px 0; background: #fffdf7; }
    .card.inactive { opacity: .72; }
    .card dl { display: grid; grid-template-columns: 86px 1fr; gap: 4px 8px; margin: 8px 0 0; font-size: 13px; }
    .card dt { color: #91836f; }
    .card dd { margin: 0; word-break: break-all; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .snapshot { display: grid; gap: 1px; border: 1px solid #d9cdbc; padding: 3px; background: #d9cdbc; border-radius: 4px; width: 110px; }
    .snapshot i { aspect-ratio: 1; display: block; }
    .snapline { display: flex; gap: 10px; align-items: flex-start; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #e1d5c5; vertical-align: middle; }
    th { color: #76695e; font-weight: 700; white-space: nowrap; }
    tr.live { cursor: pointer; }
    tr.live:hover { background: #f6efe2; }
    .filters { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; margin-bottom: 10px; }
    .ledger { margin: 0 14px 14px; }
    .banner { margin: 0 0 10px; padding: 8px 10px; border-radius: 6px; font-size: 13px; }
    .banner.warn { background: #f7e3de; color: #8a2f25; border: 1px solid #e3b4ab; }
    .banner.ok { background: #e4efe6; color: #2f5a3a; border: 1px solid #bcdcc4; }
    .banner.info { background: #efe6d4; color: #6e5a2f; border: 1px solid #ddcba4; }
    #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: #2b2520; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; max-width: 80vw; }
    #toast.show { opacity: .95; }
    .hidden { display: none !important; }
    @media (max-width: 1100px) { header { display: block; } .app { grid-template-columns: 1fr; } .filters { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>手工织锦纹样授权交付台</h1>
      <div class="muted">网格色线快照送审 · 审核与制版分离 · 通过后生成授权期限与适用范围交付单</div>
    </div>
    <div class="toolbar">
      <button id="exportPatternBtn" class="secondary">导出纹样JSON</button>
    </div>
  </header>

  <main class="app">
    <!-- 左：方案信息 + 画布与色线 -->
    <aside class="panel">
      <h2>方案信息</h2>
      <label>项目编号</label>
      <input id="projectNo" placeholder="如 XJ-2026-018">
      <div class="row2">
        <div><label>版本号</label><input id="version" placeholder="如 v1.0"></div>
        <div><label>客户</label><input id="customer" list="customerList" placeholder="客户名称"></div>
      </div>
      <label>制版人</label>
      <input id="maker" placeholder="送审后审核人须为另一人">
      <datalist id="customerList"></datalist>
      <div class="actions">
        <button id="createSchemeBtn">保存为方案</button>
        <button id="newVersionBtn" class="secondary hidden">基于定稿建新版本</button>
        <button id="newCanvasBtn" class="secondary hidden">另开新画布</button>
      </div>

      <h2>画布</h2>
      <div class="row2">
        <div><label>经向列数</label><input id="cols" type="number" value="18" min="6" max="36"></div>
        <div><label>纬向行数</label><input id="rows" type="number" value="14" min="6" max="32"></div>
      </div>
      <div class="actions"><button id="newBtn" class="secondary">新建空网格</button></div>

      <h2>色线库</h2>
      <div class="palette" id="palette"></div>
      <div class="row2" style="margin-top:8px">
        <div>
          <label>替换当前色线颜色</label>
          <input id="colorReplace" type="color" value="#a6322d" style="padding:2px;height:36px">
        </div>
        <div style="display:flex;align-items:end"><button id="replaceColorBtn" class="secondary" style="width:100%">换色</button></div>
      </div>

      <h2>基础纹样块</h2>
      <div class="blocks">
        <button data-block="dot" class="secondary">单点</button>
        <button data-block="cross" class="secondary">十字</button>
        <button data-block="diamond" class="secondary">小菱形</button>
      </div>
    </aside>

    <!-- 中：画布 -->
    <section class="panel">
      <div id="canvasBanner"></div>
      <div class="grid" id="grid"></div>
      <div class="toolbar" style="margin-top:10px;max-width:240px">
        <button id="undoBtn" class="secondary">撤销</button>
        <button id="redoBtn" class="secondary">重做</button>
      </div>
      <p class="muted">点击填色，按住拖动可连续填色。客户确认前改动会使在途交付单自动失效。</p>
      <h2>用色统计</h2>
      <div class="stats" id="stats"></div>
      <h2>断线风险</h2>
      <div id="risk"></div>
    </section>

    <!-- 右：送审 / 审核 / 交付流转 -->
    <aside class="panel">
      <h2>授权交付</h2>
      <div id="flow">
        <p class="muted">先在左侧保存方案，再冻结快照送审。</p>
      </div>
    </aside>
  </main>

  <!-- 底：交付台账 -->
  <section class="panel ledger">
    <h2>方案与交付台账</h2>
    <div class="filters">
      <div>
        <label>按客户筛选</label>
        <select id="filterCustomer"><option value="">全部客户</option></select>
      </div>
      <div>
        <label>按状态筛选</label>
        <select id="filterStatus">
          <option value="all">全部状态</option>
          <option value="unsent">未送审</option>
          <option value="in_review">送审中</option>
          <option value="rejected">已驳回</option>
          <option value="approved">待客户确认</option>
          <option value="expired">已到期</option>
          <option value="confirmed">客户已确认</option>
          <option value="invalidated">已失效（留档）</option>
        </select>
      </div>
      <button id="clearFilterBtn" class="secondary">清除筛选</button>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>项目编号</th><th>版本</th><th>客户</th><th>制版人</th><th>审核人</th>
            <th>状态</th><th>交付单号</th><th>适用范围</th><th>授权期限</th><th>剩余</th><th></th>
          </tr>
        </thead>
        <tbody id="ledgerBody"></tbody>
      </table>
    </div>
  </section>

  <div id="toast"></div>

  <script src="snapshot.js"></script>
  <script src="authorization.js"></script>
  <script src="app.js"></script>
</body>
</html>
